import com.android.build.api.artifact.SingleArtifact
import groovy.json.JsonOutput
import org.apache.tools.ant.filters.FixCrLfFilter

apply plugin: 'com.android.library'
apply from: file(rootProject.file('module.gradle'))

android {
    namespace = "zygisk.il2cppdumper"
    compileSdk = rootProject.ext.targetSdk
    ndkVersion = '28.2.13676358'

    defaultConfig {
        minSdk = rootProject.ext.minSdk
        targetSdk = rootProject.ext.targetSdk

        externalNativeBuild {
            cmake {
                arguments("-DMODULE_NAME:STRING=$moduleLibraryName")
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "4.1.2"
        }
    }
}

tasks.register("updateJson") {
    description = "Regenerate update.json at the repo root from module.gradle values"
    group = "build"

    def updateJsonFile = file("$rootDir/update.json")
    def repo = moduleUpdateRepo
    def branch = moduleUpdateBranch
    def version = moduleVersion
    def versionCode = moduleVersionCode
    // Matches the release zip name produced by the zipRelease task, so the
    // asset uploaded to the GitHub release is exactly what this URL points at.
    def releaseZipName = "${moduleName.replace(' ', '_')}-${version}(${versionCode})-release.zip"

    inputs.property("version", version)
    inputs.property("versionCode", versionCode)
    inputs.property("repo", repo)
    inputs.property("branch", branch)
    outputs.file(updateJsonFile)

    doLast {
        def json = [
                version    : version,
                versionCode: versionCode,
                zipUrl     : "https://github.com/${repo}/releases/download/${version}/${releaseZipName}".toString(),
                changelog  : "https://raw.githubusercontent.com/${repo}/${branch}/changelog.md".toString(),
        ]
        updateJsonFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(json)) + "\n"
        println "Wrote ${updateJsonFile}"
    }
}

androidComponents {
    def adbProvider = sdkComponents.adb

    onVariants(selector().all()) { variant ->
        def variantCapped = variant.name.capitalize()
        def variantLowered = variant.name.toLowerCase()

        def zipName = "${moduleName.replace(' ', '_')}-${moduleVersion}(${moduleVersionCode})-${variantLowered}.zip"
        def moduleDir = file("$outDir/module_$variantLowered")
        def aarArtifact = variant.artifacts.get(SingleArtifact.AAR.INSTANCE)

        tasks.register("prepareModuleFiles${variantCapped}", Sync) {
            dependsOn("assemble$variantCapped")

            def templatePath = "$rootDir/template/module"

            into moduleDir
            from(templatePath) {
                exclude 'module.prop'
            }

            from(templatePath) {
                include 'module.prop'
                expand([
                        id         : moduleId,
                        name       : moduleName,
                        version    : moduleVersion,
                        versionCode: moduleVersionCode.toString(),
                        author     : moduleAuthor,
                        description: moduleDescription,
                ])
                filter(FixCrLfFilter.class,
                        eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }

            // AAR packs native libs at jni/<abi>/lib*.so; Zygisk expects them
            // at zygisk/<abi>.so, so map each entry straight to its final path.
            from(aarArtifact.map { zipTree(it) }) {
                include 'jni/*/*.so'
                includeEmptyDirs = false
                eachFile { it.path = "zygisk/${it.relativePath.segments[1]}.so" }
            }

            def moduleShTree = fileTree(moduleDir).matching { include '**/*.sh' }

            doLast {
                // Set executable permissions for shell scripts
                moduleShTree.each {
                    it.setExecutable(true, false)
                }
            }
        }

        tasks.register("zip${variantCapped}", Zip) {
            dependsOn("prepareModuleFiles${variantCapped}")
            from moduleDir
            archiveFileName.set(zipName)
            destinationDirectory.set(outDir)
        }

        tasks.register("push${variantCapped}", Exec) {
            dependsOn("zip${variantCapped}")
            workingDir outDir
            commandLine adbProvider.get().asFile, "push", zipName, "/data/local/tmp/"
        }

        tasks.register("flash${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            commandLine adbProvider.get().asFile, "shell", "su", "-c",
                    "magisk --install-module /data/local/tmp/${zipName}"
        }

        tasks.register("flashAndReboot${variantCapped}", Exec) {
            dependsOn("flash${variantCapped}")
            commandLine adbProvider.get().asFile, "shell", "reboot"
        }

        afterEvaluate {
            tasks.named("assemble${variantCapped}").configure {
                finalizedBy("zip${variantCapped}")
            }
            if (variantLowered == "release") {
                tasks.named("zip${variantCapped}").configure {
                    finalizedBy("updateJson")
                }
            }
        }
    }
}